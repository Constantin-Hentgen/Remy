services:
  remy:
    build: .
    # Use the published image instead of building from source (pin a version in production):
    # image: ghcr.io/constantin-hentgen/remy:latest
    container_name: remy
    restart: unless-stopped
    # Each variable is interpolated from the .env file next to this file (docker compose) or from the Portainer
    # stack UI. A missing variable arrives empty and takes the code default (see .env.example).
    environment:
      REMY_API_KEY: ${REMY_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      REMY_MODEL: ${REMY_MODEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
    ports:
      - "${REMY_PORT:-18100}:8000"
