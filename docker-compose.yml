services:
  remy:
    build: .
    # Once releases are published (milestone 3), you can use the image instead of building:
    # image: ghcr.io/constantin-hentgen/remy:latest
    container_name: remy
    restart: unless-stopped
    # Each variable is interpolated from the .env file next to this file (docker compose) or from the Portainer
    # stack UI. A missing variable arrives empty and takes the code default (see .env.example).
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/remy.db}
      REMY_ADMIN_KEY: ${REMY_ADMIN_KEY:-}
      REMY_AUTO_MIGRATE: ${REMY_AUTO_MIGRATE:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
    ports:
      - "${REMY_PORT:-18100}:8000"
    volumes:
      - remy-data:/data

volumes:
  remy-data:
