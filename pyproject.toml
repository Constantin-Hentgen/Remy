[project]
name = "kcalibre"
version = "0.0.0"
description = "Self-hosted nutrition tracking for endurance athletes: food lookup, meal log and energy balance against training."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
authors = [{ name = "kcalibre contributors" }]
keywords = ["nutrition", "ciqual", "endurance", "running", "energy-balance", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering",
]
# The library core (food search, nutrient computation, energy needs, anomaly detection) depends on nothing
# heavier than pydantic, so clients can embed it. The HTTP service lives behind the `server` extra.
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
]

[project.urls]
Homepage = "https://github.com/Constantin-Hentgen/kcalibre"
Documentation = "https://github.com/Constantin-Hentgen/kcalibre/wiki"
Changelog = "https://github.com/Constantin-Hentgen/kcalibre/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "kcalibre[server]",
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kcalibre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
