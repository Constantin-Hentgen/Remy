[project]
name = "remy"
version = "0.6.0"
description = "Self-hosted nutrition tracking for endurance athletes: food lookup, meal log and energy balance against training."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
authors = [{ name = "Remy contributors" }]
keywords = ["nutrition", "ciqual", "endurance", "running", "energy-balance", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering",
]
# The library core (food search, nutrient computation, energy needs, anomaly detection) depends on nothing
# heavier than pydantic, so clients can embed it. The HTTP service lives behind the `server` extra.
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "tzdata",
    "httpx>=0.27",
]
postgres = [
    "psycopg[binary]>=3.2",
]
client = [
    "httpx>=0.27",
]

[project.scripts]
remy = "remy.cli:main"

[project.urls]
Homepage = "https://github.com/Constantin-Hentgen/Remy"
Documentation = "https://github.com/Constantin-Hentgen/Remy/wiki"
Changelog = "https://github.com/Constantin-Hentgen/Remy/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "remy[server]",
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
# RUF001-003: ×, –, − and French typography (narrow no-break spaces, « ») are intentional in this bilingual,
# formula-heavy codebase.
# SIM905: "a b c".split() keeps word lists (stopwords) readable.
ignore = ["ANN401", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
