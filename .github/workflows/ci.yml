name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs. Release pull requests get their checks from the pull_request run, which the
  # release-please workflow approves (GitHub holds runs on PRs opened by github-actions).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --python 3.13
      - name: Lint
        run: uv run --frozen ruff check
      - name: Check formatting
        run: uv run --frozen ruff format --check
      - name: Run tests
        run: uv run --frozen python -m pytest -q

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and probe /health
        run: |
          docker build -t remy:ci .
          docker run --rm --entrypoint python remy:ci -c "import psycopg"  # Postgres driver is in the image
          docker run -d --name remy -p 8000:8000 remy:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs remy
          exit 1
