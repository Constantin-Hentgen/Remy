name: release-please

# Conventional Commits on main open or update a release pull request (version + CHANGELOG.md);
# merging it creates the vX.Y.Z tag and the GitHub release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please cannot edit uv.lock: sync it with the new version on the open release branch.
      # Then approve CI there: GitHub holds pull_request runs on PRs opened by github-actions for approval
      # ("action_required"), and without them the required checks never report on the release PR
      # (checks from a workflow_dispatch run do not count for a PR).
      # The branch comes from the action's `pr` output (set when this run created or updated the release PR):
      # searching for it with `gh pr list --label` races GitHub's search index and finds nothing.
      - name: Find the release pull request branch
        id: pr
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: echo "branch=$(jq -r '.headBranchName' <<<"$PR_JSON")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: ${{ steps.pr.outputs.branch != '' }}
        with:
          ref: ${{ steps.pr.outputs.branch }}
      - uses: astral-sh/setup-uv@v6
        if: ${{ steps.pr.outputs.branch != '' }}
      - name: Sync uv.lock with the release version
        if: ${{ steps.pr.outputs.branch != '' }}
        run: |
          uv lock
          if ! git diff --quiet uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: sync uv.lock with the release version"
            git push
          fi
      - name: Approve CI on the release pull request
        if: ${{ steps.pr.outputs.branch != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          head=$(git rev-parse HEAD)
          # The run for the head commit appears a few seconds after the push.
          for i in $(seq 1 24); do
            ids=$(gh run list -R "$REPO" --branch "$BRANCH" --event pull_request --status action_required \
              --json databaseId,headSha -q ".[] | select(.headSha == \"$head\") | .databaseId")
            [ -n "$ids" ] && break
            sleep 5
          done
          if [ -z "$ids" ]; then
            echo "::warning::No held CI run found for $head on $BRANCH; approve it from the Actions tab."
            exit 0
          fi
          for id in $ids; do gh api -X POST "repos/$REPO/actions/runs/$id/approve"; done
